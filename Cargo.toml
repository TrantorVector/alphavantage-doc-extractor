[package]
name = "alphavantage-doc-extractor"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/TrantorVector/alphavantage-doc-extractor"

[dependencies]
# CLI
clap = { version = "4.4", features = ["derive", "env", "wrap_help"] }
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# HTTP
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }
scraper = "0.18"
html5ever = "0.26"
url = "2.5"
# Errors
thiserror = "1.0"
anyhow = "1.0"
# Async
tokio = { version = "1.35", features = ["rt-multi-thread", "macros"] }
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
# Utils
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
regex = "1.10"

[dev-dependencies]
mockito = "1.2"
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8"
insta = "1.34"
tokio-test = "0.4"
proptest = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 1
